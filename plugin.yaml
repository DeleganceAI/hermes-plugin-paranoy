name: paranoy
version: "0.5.0"
manifest_version: 2
api_version: 1
description: >
  Grounds a Hermes agent in a Paranoy evidence ledger. What people say is
  stored as evidence in the background, every reply searches the ledger
  first, and /decide runs a decision from what is on record. The agent key
  stays in Hermes as PARANOY_BOT_SECRET_HEX; the model never holds it.
  Calls are signed in-process and sent to server_url/mcp over HTTPS. A
  journal of captures, searches and writes is kept under the Hermes plugin
  data directory.
author: DeleganceAI
license: GPL-3.0
homepage: https://github.com/DeleganceAI/hermes-plugin-paranoy
requires_hermes: ">=0.21.0"
tags: [ledger, nostr, paranoy]
python_dependencies:
  - "httpx>=0.27,<0.29"
provides_tools:
  - paranoy_search
  - paranoy_read
  - paranoy_ingest
  - paranoy_store_evidence
  - paranoy_store_claim
  - paranoy_check_proof
provides_hooks:
  - pre_llm_call
  - post_gateway_admission
  - transform_llm_output
  - subagent_start
  - subagent_stop
config_schema:
  server_url:
    type: str
    default: "https://paranoy.org"
    label: Server URL
    description: Paranoy server base URL. Calls go to this origin plus /mcp.
  collection:
    type: str
    default: ""
    label: Collection
    description: The one collection the agent reads and writes. Set with /paranoy collection.
  owner_name:
    type: str
    default: ""
    label: Owner name
    description: >
      Recorded as the source of messages captured in a terminal session,
      where Hermes gives no display name.
  capture:
    type: bool
    default: true
    label: Capture
    description: >
      Store what people say as evidence, in the background. Messages that
      are small talk, questions or instructions are skipped.
  ground:
    type: bool
    default: true
    label: Ground
    description: Search the ledger before every reply and give the agent what it finds.
  permalink_base:
    type: str
    default: ""
    label: Slack permalink base
    description: >
      For example https://yourteam.slack.com. When set, captured Slack
      messages carry a link back to the message.
  agent_name:
    type: str
    default: ""
    label: Agent name
    description: Name for the agent's profile, published with its first write.
  agent_about:
    type: str
    default: ""
    label: Agent about
    description: About text for the profile. Say that this key is an agent.
  terms_version:
    type: str
    default: "1"
    label: Terms version
    description: Terms version to sign.
  terms_sha256:
    type: str
    default: "ef0c5a74783a3639172ab7dd1d7df764611bb70e29dccfb34823cc0a86154626"
    label: Terms SHA-256
    description: SHA-256 of the current Paranoy terms text.
  bot_secret:
    type: secret
    env: PARANOY_BOT_SECRET_HEX
    required: false
    label: Bot secret
    description: >
      Agent Nostr secret, 64-character hex or nsec. Hermes stores it. It is
      never written to config.yaml or this repository. A missing value does
      not disable the plugin.
